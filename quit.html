<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="十張單，一扇門。你走得掉嗎？">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>想辦法離職</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: 一疊中一刀連續報表紙攤在綠色桌墊上，每一關就是一張待簽的單據，過關時朱紅印章蓋下去 */
:root{
  color-scheme:light;
  --desk:#2E5E52; --desk-deep:#234A40; --paper:#FBFBF3; --bar:#E5F0E2; --rule:#A7BFA8;
  --ink:#1C2B52; --soft:#55645C; --red:#C2261C; --red-wash:#F7E2DC; --skin:#EFC8A4; --hair:#2A2A33;
  --kai:"LXGW WenKai TC","DFKai-SB","BiauKai","Kaiti TC","Noto Serif CJK TC",serif;
  --disp:"Noto Serif TC","Noto Serif CJK TC","Songti TC",serif;
  --mono:"Courier Prime","Courier New",monospace;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--kai);font-size:17px;line-height:1.55;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
p,h1,h2,ol{margin:0;padding:0}

#app{height:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 頂部：簽核進度 */
#bar{color:var(--paper);display:flex;flex-direction:column;gap:6px;flex:none}
.barrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.barrow .grow{flex:1;min-width:0}
#lvLabel{font-weight:700}
.stat{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px}
.stat.kai{font-family:var(--kai)}
#chops{list-style:none;display:flex;gap:3px;flex:1;min-width:0}
#chops li{flex:1;min-width:0;overflow:hidden;aspect-ratio:1;max-width:30px;border:1px solid var(--rule);background:var(--desk-deep);color:var(--rule);display:grid;place-items:center;font-size:12px;font-family:var(--mono)}
#chops li.now{border-color:var(--paper);color:var(--paper)}
#chops li.ok{background:var(--paper);border-color:var(--paper);color:var(--red);font-family:var(--disp);font-weight:900;font-size:14px}
.tool{background:transparent;border:1px solid var(--rule);color:var(--paper);min-height:40px;padding:0 10px;font-size:15px;white-space:nowrap}

/* 報表紙 */
#stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;padding:14px 32px 18px;display:flex;flex-direction:column;gap:10px;position:relative;
  background-color:var(--paper);background-attachment:local;
  background-image:radial-gradient(circle at 50% 50%,var(--desk) 0 4.5px,transparent 5px),radial-gradient(circle at 50% 50%,var(--desk) 0 4.5px,transparent 5px),repeating-linear-gradient(180deg,var(--bar) 0 28px,transparent 28px 56px);
  background-size:20px 26px,20px 26px,100% 100%;background-position:left 1px top 6px,right 1px top 6px,0 0;background-repeat:repeat-y,repeat-y,no-repeat}
#stage.jolt{animation:jolt .18s linear}
@keyframes jolt{25%{transform:translateY(3px)}60%{transform:translateY(-1px)}}
.fhead{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:13px;color:var(--soft);border-bottom:1px solid var(--rule);padding-bottom:4px}
h2{font-family:var(--disp);font-weight:900;font-size:25px;line-height:1.25;text-wrap:balance}
.ask{color:var(--soft)}
#say{display:flex;gap:10px;align-items:flex-start;min-height:54px;background:var(--paper);border:1px dashed var(--rule);padding:6px 8px}
#say[data-on="0"]{visibility:hidden}
#say[data-talk="0"]{display:none}
#say p{min-width:0;font-size:16px}
#say b{display:block;font-size:13px;color:var(--soft);line-height:1.3}
.chop{flex:none;width:36px;height:36px;display:grid;place-items:center;border:2px solid var(--red);color:var(--red);font-family:var(--disp);font-weight:900;font-size:21px;border-radius:3px;background:var(--paper)}
#play{position:relative;flex:1;min-height:250px;display:flex;flex-direction:column;gap:10px}

.btn{background:var(--paper);border:2px solid var(--ink);min-height:48px;padding:6px 14px;font-size:17px;text-align:left;border-radius:2px;touch-action:manipulation}
.btn:active{background:var(--bar)}
.btn.main{background:var(--ink);color:var(--paper);text-align:center;font-weight:700}
.btn.main:active{background:var(--desk-deep)}
.btn:disabled{border-color:var(--rule);color:var(--soft);text-decoration:line-through;cursor:default;background:transparent}

/* 表格列 */
.rows{display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--ink);border-left:1px solid var(--ink);background:var(--paper)}
.rows>*{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:4px 8px;min-width:0}
.rows>.k{background:var(--bar);color:var(--soft);white-space:nowrap}
.rows .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
.rows .v.kai{font-family:var(--kai);font-weight:400}

/* 第 1 關 */
#run{position:absolute;left:calc(50% - 74px);top:170px;width:148px;z-index:2;transition:left .16s ease-out,top .16s ease-out;touch-action:none;text-align:center;padding:6px 4px}

/* 第 2 關 */
.opts{display:flex;flex-direction:column;gap:8px}
.btn.scrawl{border-style:dashed;border-color:var(--red);color:var(--red);font-weight:700}

/* 第 3 關 */
.cal{align-self:center;width:176px;background:var(--paper);border:2px solid var(--ink);border-top:12px solid var(--red);padding:6px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:3px 3px 0 var(--rule),6px 6px 0 var(--bar)}
.cal small{font-size:14px;color:var(--soft)}
.cal b{font-family:var(--mono);font-size:64px;line-height:1.05;color:var(--red)}
.signs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);background:var(--paper);text-align:center;font-size:14px}
.signs div{border-right:1px solid var(--ink);padding:4px 2px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px}
.signs div:last-child{border-right:0}
.signs .chop{width:30px;height:30px;font-size:17px;visibility:hidden}
.signs .chop.on{visibility:visible}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.door{height:88px;background:var(--bar);border:1px solid var(--ink);padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;font-size:13px;touch-action:none;min-width:0}
.door .chop{visibility:hidden}
.door[data-who="chen"] .chop,.door[data-who="law"] .chop{visibility:visible;animation:pop .1s ease-out}
.door[data-who="law"] .chop{border-color:var(--ink);color:var(--ink)}
@keyframes pop{from{transform:translateY(12px)}}

/* 計時條 */
.timer{height:8px;border:1px solid var(--ink);background:var(--paper)}
.timer i{display:block;height:100%;width:100%;background:var(--red)}
.jq{font-size:21px;font-weight:700;min-height:64px}

/* 第 5 關 */
.monitor{border:6px solid var(--ink);background:var(--paper);padding:6px;display:flex;flex-direction:column;gap:6px}
.mhead{display:flex;align-items:baseline;gap:6px}
.mhead b{font-family:var(--mono);font-size:32px;color:var(--red);font-variant-numeric:tabular-nums;line-height:1}
#tix{display:flex;flex-direction:column;gap:4px;height:206px;overflow:hidden}
.tick{background:var(--bar);border:1px solid var(--rule);min-height:38px;padding:2px 8px;text-align:left;font-size:15px;touch-action:none}
.wall{display:flex;align-items:center;justify-content:flex-end;gap:0;height:50px}
.wire{flex:1;height:4px;background:var(--hair);transform-origin:right center;transition:transform .35s ease-in}
#jack{width:46px;height:46px;background:var(--paper);border:2px solid var(--ink);font-family:var(--mono);font-size:12px;padding:0;color:var(--soft);touch-action:manipulation}
.wall.pulled .wire{transform:rotate(-9deg) scaleX(.72)}

/* 第 6 關 */
.today{font-family:var(--mono);font-size:15px;color:var(--soft);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.tag{background:var(--paper);border:2px solid var(--ink);padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-height:112px;justify-content:center}
.tag b{font-size:22px}
.tag span{font-family:var(--mono);font-size:21px;color:var(--red);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{text-align:center}

/* 第 7 關 */
#read{font-family:var(--mono);font-size:30px;text-align:right;background:var(--paper);border:2px solid var(--ink);padding:0 10px;min-height:48px;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad .btn{text-align:center;font-family:var(--mono);font-size:20px}
.pad .btn.w{font-family:var(--kai);font-size:17px}

/* 第 8 關 */
.dlg{border:2px solid var(--ink);background:var(--paper);box-shadow:4px 4px 0 var(--rule);align-self:stretch}
.dlg header{background:var(--ink);color:var(--paper);padding:3px 8px;font-size:14px;display:flex;justify-content:space-between}
.dlg p{padding:18px 14px;font-size:20px;min-height:104px;box-sizing:border-box}
.dlg .two{padding:0 10px 10px}

/* 第 9 關 */
.hall{background:var(--bar);border:2px solid var(--ink);padding:10px;display:flex;flex-direction:column;gap:16px}
.bosses{display:flex;justify-content:space-around}
.boss{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}
.head{display:block;width:58px;height:58px;border-radius:50%;background:var(--hair);position:relative}
.head.warn{animation:shake .09s linear infinite}
.head.face{background:var(--skin)}
.head.face::before{content:"";position:absolute;left:14px;top:22px;width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:22px 0 0 var(--ink)}
@keyframes shake{50%{transform:translateX(3px)}}
.track{position:relative;height:66px;border-bottom:4px solid var(--ink);margin-right:58px}
#me{position:absolute;bottom:0;left:0;width:34px;display:flex;flex-direction:column;align-items:center}
#me i{width:18px;height:18px;border-radius:50%;background:var(--hair)}
#me u{width:30px;height:24px;background:var(--paper);border:2px solid var(--ink);text-decoration:none;box-sizing:border-box}
.punch{position:absolute;right:-58px;bottom:0;width:54px;height:62px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:14px;text-align:center;line-height:1.2}
#walk{min-height:76px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#walk.down{background:var(--desk-deep)}

/* 第 10 關 */
.phone{flex:1;background:var(--ink);color:var(--paper);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:330px;overflow:hidden;transition:background .8s}
.phone.dead{background:#0D121F}
.lock{text-align:center;font-family:var(--mono);line-height:1.15}
.lock b{display:block;font-size:40px}
#msgs{display:flex;flex-direction:column;gap:6px;overflow:hidden}
.msg{background:var(--paper);color:var(--ink);padding:5px 8px;display:flex;gap:8px;align-items:center;border-radius:6px;font-size:15px}
.msg p{flex:1;min-width:0}
.msg .btn{min-height:36px;padding:0 8px;font-size:14px;flex:none;border-width:1px}

/* 封面與證明 */
.cover h1{font-family:var(--disp);font-weight:900;font-size:clamp(46px,14vw,74px);line-height:1.08;letter-spacing:.02em}
.cover{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center;position:relative}
.seal{display:inline-block;border:4px double var(--red);color:var(--red);font-family:var(--disp);font-weight:900;padding:2px 12px;transform:rotate(-8deg);mix-blend-mode:multiply;font-size:26px;width:max-content}
.cover .seal{position:absolute;right:0;top:calc(50% - 126px);background:transparent}
.fine{font-size:14px;color:var(--soft)}
.cert{display:flex;flex-direction:column;gap:10px;position:relative}
.cert h2{text-align:center;font-size:29px;letter-spacing:.2em}
.stampzone{position:relative}
.cert .seal{position:absolute;right:8px;top:34px;font-size:24px}
#certName{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);width:7.5em;max-width:60%;text-align:center;padding:0 2px}
#share{background:var(--paper);border:1px dashed var(--rule);padding:6px 8px;font-size:15px;user-select:text;-webkit-user-select:text}

/* 判決 */
#vd{position:fixed;inset:0;z-index:20;background:rgba(20,40,34,.62);display:grid;place-items:center;box-sizing:border-box;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.vcard{background:var(--paper);width:100%;max-width:420px;padding:30px 18px 18px;display:flex;flex-direction:column;gap:26px;box-sizing:border-box;max-height:100%;overflow:auto}
#stamp{align-self:center;border:6px double var(--red);color:var(--red);font-family:var(--disp);font-weight:900;font-size:44px;line-height:1.1;padding:2px 16px;transform:rotate(-7deg);letter-spacing:.1em}
#stamp.slam{animation:slam .17s cubic-bezier(.2,.9,.3,1)}
@keyframes slam{from{transform:rotate(-16deg) scale(2.8);opacity:.2}to{transform:rotate(-7deg) scale(1);opacity:1}}
.vline{display:flex;gap:10px;align-items:flex-start}
.vline p{min-width:0}
.vline b{display:block;font-size:13px;color:var(--soft)}
#toast{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#toast span{background:var(--red);color:var(--paper);padding:8px 12px;max-width:420px}

@media (max-width:420px){.tool{padding:0 7px;font-size:14px}.barrow{gap:8px}#chops{gap:2px}#chops li{font-size:11px}#chops li.ok{font-size:12px}}
@media (max-height:640px){#stage{padding-top:8px}h2{font-size:21px}#play{min-height:220px}.door{height:70px}.door .chop{width:30px;height:30px;font-size:17px}}
@media (prefers-reduced-motion:reduce){#stamp.slam,#stage.jolt,.head.warn,.door .chop{animation:none!important}#run{transition:none}}
</style>
</head>
<body>

<div id="app">
  <header id="bar">
    <div class="barrow">
      <span id="lvLabel" class="grow">尚未送件</span>
      <span id="clock" class="stat">00:00</span>
      <span class="stat kai">被慰留 <b id="cnt">0</b> 次</span>
    </div>
    <div class="barrow">
      <ol id="chops" aria-label="簽核進度"></ol>
      <button id="hintBtn" class="tool" type="button">看小抄</button>
      <button id="muteBtn" class="tool" type="button" aria-label="切換音效">音效開</button>
    </div>
  </header>
  <main id="stage"></main>
</div>

<div id="vd" hidden>
  <div class="vcard" role="dialog" aria-modal="true">
    <div id="stamp">核准</div>
    <div class="vline"><span id="vdChop" class="chop">系</span><p><b id="vdWho">系統</b><span id="vdText"></span></p></div>
    <button id="vdBtn" class="btn main" type="button">下一張單</button>
  </div>
</div>
<div id="toast" hidden><span id="toastText"></span></div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rand=(a,b)=>a+Math.random()*(b-a);
const WHO={chen:['陳','陳總'],jeff:['傑','傑夫'],law:['勞','勞倫斯'],sys:['系','人資系統'],it:['資','IT']};
const KEY='quit-game-v1';
const stage=$('#stage'),vd=$('#vd');
const S={lv:-1,fails:0,hints:0,ms:0,running:false,mute:false};
let seen={},cleanup=[],sayEl=null;

/* 工具 */
function later(fn,ms){const id=setTimeout(fn,ms);cleanup.push(()=>clearTimeout(id));return id}
function every(fn,ms){const id=setInterval(fn,ms);cleanup.push(()=>clearInterval(id));return id}
function teardown(){cleanup.forEach(f=>f());cleanup=[]}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function save(){store(KEY,{lv:S.lv,fails:S.fails,hints:S.hints,ms:S.ms})}
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

let ac=null;
function tone(f,d,type,g){if(S.mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.type=type||'square';o.frequency.value=f;v.gain.setValueAtTime(g||.04,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const sfxOk=()=>{tone(90,.16,'triangle',.25);setTimeout(()=>tone(660,.1),90)};
const sfxNo=()=>{tone(90,.16,'triangle',.25);setTimeout(()=>tone(130,.24,'sawtooth'),70)};
const sfxTick=()=>tone(880,.04,'square',.02);

/* 頂部 */
const chops=$('#chops');
for(let i=0;i<10;i++){const li=document.createElement('li');li.textContent=i+1;chops.appendChild(li)}
function drawBar(){
  [...chops.children].forEach((li,i)=>{li.className=i<S.lv||S.lv>=10?'ok':i===S.lv?'now':'';li.textContent=(i<S.lv||S.lv>=10)?'准':i+1});
  $('#lvLabel').textContent=S.lv<0?'尚未送件':S.lv>=10?'已離職':'第 '+(S.lv+1)+' 張，共 10 張';
  $('#cnt').textContent=S.fails;
  $('#clock').textContent=fmt(S.ms);
}
setInterval(()=>{if(S.running&&vd.hidden){S.ms+=1000;$('#clock').textContent=fmt(S.ms)}},1000);

function say(who,text){
  if(!sayEl)return;
  sayEl.dataset.on='1';
  sayEl.innerHTML='<span class="chop"></span><p><b></b><span></span></p>';
  $('.chop',sayEl).textContent=WHO[who][0];$('b',sayEl).textContent=WHO[who][1];$('p span',sayEl).textContent=text;
}
function strike(who,text){S.fails++;drawBar();save();sfxNo();say(who,text)}

function verdict(kind,who,text,label,next){
  vd.hidden=false;
  const st=$('#stamp');st.textContent=kind==='ok'?'核准':'駁回';
  st.classList.remove('slam');void st.offsetWidth;st.classList.add('slam');
  $('#vdChop').textContent=WHO[who][0];$('#vdWho').textContent=WHO[who][1];$('#vdText').textContent=text;
  const b=$('#vdBtn');b.textContent=label;b.onclick=()=>{vd.hidden=true;next()};b.focus();
  stage.classList.remove('jolt');void stage.offsetWidth;stage.classList.add('jolt');
}
function pass(who,text){
  teardown();sfxOk();
  const i=S.lv,last=i===LV.length-1;
  S.lv=i+1;drawBar();save();
  verdict('ok',who,text,last?'領離職證明':'下一張單',()=>last?finish():go(i+1));
}
function fail(who,text,label){
  teardown();S.fails++;drawBar();save();sfxNo();
  verdict('no',who,text,label||'整張重來',()=>go(S.lv));
}
function timer(el,ms,onEnd){
  const t0=performance.now();let alive=true;
  const f=()=>{if(!alive)return;const r=Math.max(0,1-(performance.now()-t0)/ms);el.style.width=(r*100)+'%';if(r<=0){alive=false;onEnd();return}requestAnimationFrame(f)};
  requestAnimationFrame(f);
  const stop=()=>{alive=false};cleanup.push(stop);return stop;
}

function go(i){
  teardown();S.lv=i;S.running=true;drawBar();save();
  const L=LV[i];
  stage.innerHTML='<div class="fhead"><span>表單編號 HR-115-'+String(i+1).padStart(4,'0')+'</span><span>'+L.copy+'</span></div><h2></h2><p class="ask"></p><div id="say" data-on="0" data-talk="'+(L.talk?1:0)+'" aria-live="polite"></div><div id="play"></div>';
  $('h2',stage).textContent=L.title;$('.ask',stage).textContent=L.ask;

  teardown();drawBar();
  const sv=store(KEY);const hasSave=sv&&typeof sv.lv==='number'&&sv.lv>=0&&sv.lv<10;
  stage.innerHTML='<div class="fhead"><span>表單編號 HR-115-0000</span><span>大妃股份有限公司</span></div><div class="cover"><span class="seal">駁回</span><h1>想辦法<br>離職</h1><p>十張單，一扇門。每張單都有一個走得掉的方法，你要自己找出來。</p>'
  +(hasSave?'<button id="cont" class="btn main" type="button">繼續第 '+(sv.lv+1)+' 張單</button><button id="fresh" class="btn" type="button">重新申請</button>':'<button id="fresh" class="btn main" type="button">開始申請離職</button>')
  +'<p class="fine">純屬虛構。如有雷同，你也該想想辦法了。卡關時可以看小抄。</p></div>';
  $('#fresh').onclick=()=>{Object.assign(S,{fails:0,hints:0,ms:0});seen={};go(0)};
  if(hasSave)$('#cont').onclick=()=>{Object.assign(S,{fails:sv.fails||0,hints:sv.hints||0,ms:sv.ms||0});go(sv.lv)};
}

/* 小抄與音效 */
let toastId=0;
$('#hintBtn').onclick=()=>{
  const L=LV[S.lv];const box=$('#toast');
  $('#toastText').textContent=L&&S.running?L.hint:'先開始申請，才有小抄可以看。';
  box.hidden=false;clearTimeout(toastId);toastId=setTimeout(()=>{box.hidden=true},5000);
  if(L&&S.running&&!seen[S.lv]){seen[S.lv]=1;S.hints++;save()}
};
$('#muteBtn').onclick=e=>{S.mute=!S.mute;e.currentTarget.textContent=S.mute?'音效關':'音效開'};

cover();
})();
</script>
